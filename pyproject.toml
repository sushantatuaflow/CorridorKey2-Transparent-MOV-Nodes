[project]
name = "corridorkey2-transparent-mov-nodes"
description = "Six-node CorridorKey 2.0 and transparent ProRes 4444 MOV bundle for ComfyUI."
version = "1.1.0.1"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "safetensors>=0.4",
    "einops>=0.8",
    "timm>=1.0",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "huggingface_hub>=0.34",
    "av",
]

[project.urls]
Repository = "https://github.com/marawan206/ComfyUI-CorridorKey2.0"
Issues = "https://github.com/marawan206/ComfyUI-CorridorKey2.0/issues"

[tool.comfy]
PublisherId = "local-bundle"
DisplayName = "CorridorKey 2.0 + Transparent MOV"
Icon = ""
requires-comfyui = ">=0.25.0"

